name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: admissions_test
          POSTGRES_USER: admissions_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admissions_test -d admissions_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Package React with Java and run integration tests
        run: |
          mkdir -p backend/src/main/resources/static
          cp -R frontend/dist/. backend/src/main/resources/static/
          mvn -B -f backend/pom.xml verify
      - name: Verify the production API against PostgreSQL
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/admissions_test
          TEST_DB_USERNAME: admissions_test
          TEST_DB_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: mvn -B -f backend/pom.xml test
