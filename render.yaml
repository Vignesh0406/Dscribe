# Deployment requires custom-domain verification before launch.
services:
  - type: web
    name: dscribe-admissions
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: admissions-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: admissions-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: admissions-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: admissions-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: admissions-db
          property: password
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: admissions-db
    databaseName: admissions
    user: admissions
    plan: 0.1c-256mb
    region: singapore
    ipAllowList: []
